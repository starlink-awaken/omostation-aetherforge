[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aetherforge"
version = "1.0.0"
description = "AetherForge — 算力网格 + LLM 网关 + 群体智能引擎融合栈"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "eCOS Team"},
]
keywords = ["compute", "mesh", "llm", "gateway", "swarm", "agent", "multi-agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

readme = "README.md"

dependencies = [
    "aetherforge-gateway",
    "aetherforge-mesh",
    "fastmcp>=3.4.2",
    "openai>=2.41.1",
    "httpx[socks]>=0.28.1",
    "langfuse>=2.0.0",
]

[project.optional-dependencies]
# bus-foundation 是**可选**的: 所有 import 都在 try 内, 缺失时优雅降级
# (见 bus_adapter._try_import_bus / compute_mesh...manager / swarm_engine._compat)。
# 它曾被列为硬依赖, 而其仓库是私有的 —— 独立 clone 的 CI 在 `uv sync` 阶段
# 就失败, 测试根本跑不到, main CI 自 2026-08-06 起长期红。
# 代码本就按"它可能不存在"设计, 硬依赖与该设计矛盾。
# 注: bus-foundation 不在此声明。它在私有仓, 且 uv 会解析所有 extra,
# 声明成 extra 一样会让独立 clone 的 CI 在 uv sync 阶段失败。
# 需要 bus 事件镜像时显式安装: uv pip install -e ../bus-foundation
# 代码侧无需改动 —— 所有 bus_foundation import 都在 try 内, 缺失时优雅降级。

# 保留历史: 旧 build backend (hatchling) 仍读此 section 用于 sdist/wheel 安装
# 新 uv workspace 走 [dependency-groups] (PEP 735)
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
]

[dependency-groups]
# P52 治本: dev deps 走 PEP 735 标准,与其他项目 (cockpit/runtime) 对齐
#  - pytest>=9.0: 升级匹配 l4-kernel/runtime
#  - pytest-asyncio>=1.4.0: 修复 packages/gateway/test_retry.py 的 @pytest.mark.asyncio
#  - pytest-cov>=7.1.0: 与其他项目统一覆盖支持
# CI 跑 `uv run pytest` 时 uv 装此 group,与本地 dev install 一致
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    # ruff 此前只有 [tool.ruff] 配置段而从未被声明为依赖 —— CI 的
    # `uv run ruff check` 在干净环境里必然 "Failed to spawn: ruff"。
    # 之前 CI 在装依赖阶段就挂了, 从没走到 Lint, 所以这个问题一直被掩盖。
    "ruff>=0.14",
]

[project.scripts]
aetherforge = "aetherforge.cli:main"
aetherforge-mcp = "aetherforge.mcp_server:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
aetherforge-gateway = { workspace = true }
aetherforge-mesh = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["packages/gateway/tests", "packages/mesh/tests", "packages/swarm/tests"]
pythonpath = ["src", "packages/gateway/src", "packages/mesh/src", "packages/swarm/src"]
minversion = "7.0"
addopts = "-v --tb=short -q --import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "PLE", "RUF100"]
ignore = ["S101", "S603", "S607", "S108", "S110", "S314", "S608", "E402", "E501", "SIM115", "N813", "UP047"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/aetherforge"]
