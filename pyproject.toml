[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aetherforge"
version = "1.0.0"
description = "AetherForge — 算力网格 + LLM 网关 + 群体智能引擎融合栈"
license = {text = "MIT"}
requires-python = ">=3.13"
authors = [
    {name = "eCOS Team"},
]
keywords = ["compute", "mesh", "llm", "gateway", "swarm", "agent", "multi-agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Distributed Computing",
]

readme = "README.md"

dependencies = [
    "aetherforge-gateway",
    "aetherforge-swarm",
    "aetherforge-mesh",
    "bus-foundation",
    "fastmcp>=3.4.2",
    "openai>=2.41.1",
    "httpx[socks]>=0.28.1",
]

[project.optional-dependencies]
# 保留历史: 旧 build backend (hatchling) 仍读此 section 用于 sdist/wheel 安装
# 新 uv workspace 走 [dependency-groups] (PEP 735)
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=1.0",
]

[dependency-groups]
# P52 治本: dev deps 走 PEP 735 标准,与其他项目 (cockpit/runtime) 对齐
#  - pytest>=8.4.2: 升级匹配 l4-kernel/runtime
#  - pytest-asyncio>=1.4.0: 修复 packages/gateway/test_retry.py 的 @pytest.mark.asyncio
#  - pytest-cov>=7.1.0: 与其他项目统一覆盖支持
# CI 跑 `uv run pytest` 时 uv 装此 group,与本地 dev install 一致
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
aetherforge = "aetherforge.cli:main"
aetherforge-mcp = "aetherforge.mcp_server:main"

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
aetherforge-gateway = { workspace = true }
aetherforge-swarm = { workspace = true }
aetherforge-mesh = { workspace = true }
bus-foundation = { path = "../bus-foundation" }

[tool.pytest.ini_options]
testpaths = ["packages/gateway/tests", "packages/mesh/tests", "packages/swarm/tests"]
pythonpath = ["src", "packages/gateway/src", "packages/mesh/src", "packages/swarm/src"]
minversion = "7.0"
addopts = "-v --tb=short -q --import-mode=importlib"

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "PLE", "RUF100"]
ignore = ["S101", "S603", "S607", "S108", "S110", "S314", "S608", "E402", "E501", "SIM115", "N813", "UP047"]

[tool.ruff.format]
quote-style = "double"

[tool.hatch.build.targets.wheel]
packages = ["src/aetherforge"]
