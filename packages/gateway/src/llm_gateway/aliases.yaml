# 模型别名表 — 消费者用的"意图名" → 网关能路由的模型名
#
# 迁移基准: LiteLLM 的 model_list。网关要接管它, 消费者不应被迫改名,
# 所以这里逐条对齐了 LiteLLM 曾提供的别名。
#
# 目标名的两类:
#   * omlx 本机模型 → models.json 里的键(coding / reasoning / ...)
#   * LM Link 池中的模型 → LM Studio 的模型 ID
#     LM Link 已把三台机器互联成同一个池(见 ENG-LMSTUDIO-* 的 lm_link_pool),
#     任一端点都能看到全部模型, 因此**别名不需要携带机器地址** —— 具体在哪台
#     执行由 LM Link 自己决定(lms link set-preferred-device)。
#
# 维护约定: 新增别名时只写"意图名 → 目标名"。不要在这里写 endpoint/IP,
# 那是 compute_engine SSOT 与 compute_mesh 的职责。

aliases:
  # ── 一等公民 · Claude 分档 (gw-claude / omlx launch 注入用) ──
  # 2026-09-25 实测(干净环境, 400 tok 编码题 + 8 道可执行判分题):
  #   Qwen3.6-35B-A3B-Splash  ~300 tok/s, 2 路并发各 ~310, 8/8
  #   Qwen3.8-27B-Splash      ~126 tok/s, 8/8 (dense, 深度推理更稳)
  #   coding-next(oMLX)        ~64 tok/s, 8/8;  mythos-fast ~34 tok/s, 8/8
  # Splash = target+draft 推测解码包, 由 LM Studio 原生加载(compatibility_type
  # splash, JIT + TTL), 经 LM Link 池三机可见 —— 不另起进程。
  opus: qwen3.8-27b-splash
  sonnet: qwen3.6-35b-a3b-splash
  haiku: qwen3.6-35b-a3b-splash

  # ── 调用方高频直呼的 omlx 目录名 → 实测可用档 (2026-09-25) ──
  # 工作区代码直接写 model="reasoning"(127 处)/"coding"(82)/"mid-local"(14):
  #   reasoning  oMLX GLM-4.7-Flash 能加载但推理报 local_inference_error → 真失败
  #   coding     oMLX Devstral-Small-2 24B 8bit, 6.9 tok/s
  #   mid-local  models.json 有键但 app-models 无投影 → 必失败
  # 别名优先于 omlx 键解析, 网关 fallback_chain/complexity_chains 里的
  # "coding"/"reasoning" 也随之落到可用档, 不必改 gateway.py。
  reasoning: qwen3.8-27b-splash
  coding: qwen3.6-35b-a3b-splash
  mid-local: qwen3.6-35b-a3b-splash

  # ── 本机 omlx 后端 ───────────────────────────────
  # coder 跟 sonnet 同档(Splash); coding-next 降为可点名/兜底档, 不再常驻。
  coder: qwen3.6-35b-a3b-splash
  coder-fast: qwen3.6-35b-a3b-splash
  coder-next: coding-next
  coder-moe: qwen3.6-35b-a3b-splash
  qwen3-coder: qwen3.6-35b-a3b-splash
  reasoner: qwen3.8-27b-splash
  reasoner-lite: qwen3.6-35b-a3b-splash
  glm-4.7: glm-4.7-flash:q4_k_m
  glm-flash: glm-4.7-flash:q4_k_m
  embed: embedding
  minicpm: minicpm-v-4.6
  vision-pro: minicpm-v-4.6
  qwen38-ollama: qwen3.8:27b-mlx
  mythos-1m: mythos
  rerank-fast: qllama/bge-reranker-v2-m3:q4_k_m

  # 高频意图先走 MBP 的 oMLX App。若 App 不可用，由 omlxc models.json 的
  # fallback / fallback_ollama 依次落到 LM Link 与 Ollama，别在别名层绕开
  # 统一内存准入和降级链。原 qwen/qwen3.5-9b 与 gemma-4-12b 当前均不在
  # LM Link 可见模型清单中，继续硬指会形成“配置上存在、运行时必失败”。
  triage: qwen3.6-35b-a3b-splash
  mini-9b: mythos-fast
  fast: qwen3.6-35b-a3b-splash
  mid: qwen3.8-27b-splash
  general: qwen3.8-27b-splash
  qwen38-27b: qwen-3.8-27b
  # 轻量视觉用 catalog `vision`；重视觉走 vision-large，不占用 mid/chat 槽。
  vision-mid: vision


  # ── 明确直达三节点能力池的特化别名 ─────────────────────
  mini-chat: gemma-4-e2b-it-mlx
  fast-think: gpt-oss:20b
  fast-oss: gpt-oss:20b
  # ── Splash 直达名 (2026-09-25 已晋升一等公民, 见顶部分档) ──
  coder-splash: qwen3.6-35b-a3b-splash
  splash: qwen3.6-35b-a3b-splash
  splash-27b: qwen3.8-27b-splash
  # vision-v2: MiniCPM-V 4.6(当前 vision-pro 是旧版); 同上, 试用并列。
  vision-v2: minicpm-v-4.6
  rerank: baai-bge-reranker-v2-m3-mlx
  embed-bge: bge-m3-mlx
  ocr: glm-ocr
  ocr-glm: glm-ocr
  vision-lite: qwen/qwen3-vl-4b

# 2026-09-25 活体审计: 上面 12 个别名原指向不存在的目标(coding-qwen3-30b-a3b /
# glm-4.7-flash / vision-minicpm / qwythos-9b-1m / vision-large / qwen-3.5-9b-pro 等),
# 网关全部静默兜底到 mythos-fast(含视觉别名 → 纯文本模型)。已按真实存在的模型重映射;
# 新增别名后务必实测响应的 model/provider 字段, 不能只看 HTTP 200。

# 已知未覆盖 —— 如实记录, 不要假装齐了
unsupported:
  - name: "deepseek-v4-flash · deepseek-v4-pro"
    reason: >-
      2026-09-25 实测 DeepSeek-V4 MTP MLX 权重在 oMLX(qwen-3.5-9b-flash 投影)与
      LM Studio(deepseek-v4-*-mtp-mlx)均无法推理, 此前两个别名全部静默兜底到
      mythos-fast。删除别名如实失败, 等运行时支持 deepseek_v4_mtp 再恢复。
  - name: "reasoning · reasoning-lite (oMLX GLM-4.7-Flash / Nemotron-Cascade-2)"
    reason: >-
      2026-09-25 实测 oMLX 能加载但推理返回 local_inference_error。
      reasoner → qwen3.8-27b-splash, reasoner-lite → qwen3.6-35b-a3b-splash,
      glm-4.7/glm-flash → mbp Ollama glm-4.7-flash:q4_k_m(实测可用)。
  - name: "macmini/* · macmini-ollama/* · y7000p/* · lms/* 通配符"
    reason: >-
      LiteLLM 用通配符做"直接按机器寻址"。LM Link 已把三机合成同一池,
      按机器寻址不再是常态需求; 确需指定机器时用
      `lms link set-preferred-device`, 而不是在别名里编码地址。
  - name: "ollama 上的 qwen3.5:9b"
    reason: >-
      不在 LM Link 池内。高频意图先由 mythos-fast 承接，App/LM Link
      都失败后再按 models.json 的 fallback_ollama 路由到 Ollama；
      别名层不直接编码跨机 endpoint。
