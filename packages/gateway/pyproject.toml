[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aetherforge-gateway"
version = "1.0.1"
description = "AetherForge Gateway — LLM Provider 抽象层 (Ollama/OpenAI/Anthropic/Gemini/DeepSeek/HITL)"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["llm", "provider", "gateway", "aetherforge"]

dependencies = [
    "pyyaml>=6.0.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "fastmcp>=3.4.2",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
legacy = [
    "click>=8.1.0",
    "rich>=13.0",
    "tabulate>=0.9.0",
    "gitpython>=3.1.0",
]

[project.scripts]
gateway = "llm_gateway.cli:main"
# Compatibility entry point for migrated llm-gateway capabilities.
# Run `uv sync --extra legacy` to enable legacy dependencies.
aetherforge-llm-gateway-legacy = "llm_gateway._legacy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_gateway"]
